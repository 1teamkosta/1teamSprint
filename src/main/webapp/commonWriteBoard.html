<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>통합 작성하기</title>
    <link rel="stylesheet" href="style/freeBoard.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=explore_nearby"
    />
  </head>
  <body>
    <div class="warp">
      <header>
        <div class="region">
          <span class="material-symbols-outlined"> explore_nearby </span>
          금천구 가산동
        </div>
        <div class="logo">아프리카 사장이다</div>
        <div class="headerR">
          <div class="name">
            <span class="dataName">임사장</span>
            <span>사장님</span>
          </div>

          <button class="logout">로그아웃</button>
        </div>
      </header>

      <div class="content">
        <nav class="nav">
          <div class="bord">
            <div class="boardTitle">자유게시판</div>
            <ul>
              <li class="bordCard"><a href="#">자유수다</a></li>
            </ul>
          </div>

          <div class="bord">
            <div class="boardTitle">공지사항</div>
            <ul>
              <li class="bordCard"><a href="#">공지사항</a></li>
              <li class="bordCard"><a href="#">문의</a></li>
              <li class="bordCard"><a href="#">신고</a></li>
            </ul>
          </div>

          <div class="bord">
            <div class="boardTitle">정보공유</div>
            <ul>
              <li class="bordCard"><a href="#">장사TIP</a></li>
              <li class="bordCard"><a href="#">Q&A</a></li>
              <li class="bordCard"><a href="#">동네소식</a></li>
            </ul>
          </div>

          <div class="bord">
            <div class="boardTitle">중고거래</div>
            <ul>
              <li class="bordCard"><a href="#">중고거래</a></li>
            </ul>
          </div>

          <div class="navSearchBar">
            <input type="text" class="searchInput" />
            <button class="searchBtn">검색</button>
          </div>
        </nav>

        <div class="bodyWarp">
        
          <div>
            <div class="bodyWrapHader">
              <h2 class="tilte">통합 글쓰기</h2>
            </div>
            <div>
	          	<select>
	              <option value="bizTip">장사TIP</option>
	              <option value="notice">공지사항</option>
	              <option value="localNews">동네소식</option>
	              <option value="freeBoard">자유수다</option>
	            </select>
            </div>
			<input class="inputTitle" placeholder="제목을 입력해 주세요."> <br>
			<div class="contentFunction">
				<input type="file" id="fileInput" >
				 <select>
	              <option value="0">기본서체</option>
	              <option value="1">궁서체</option>
	              <option value="2">고딕</option>
	              <option value="3">나눔글꼴</option>
	            </select>
	            <select>
	              <option value="4">10px</option>
	              <option value="5">11px</option>
	              <option value="6">12px</option>
	              <option value="7">13px</option>
	            </select>
			    <button class="bold">B</button>
			    <button class="italic">I</button>
			    <button class="underline" >U</button>
            </div>
			<textarea class="inputContent" placeholder="내용을 입력해 주세요. 어떤 표현이든 거리낌 없이 해도 되는 공간이 아닙니다."></textarea>
			<div class="submitBtn">
              <button>등록</button>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
