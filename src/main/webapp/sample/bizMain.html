      <div class="content">
        <nav class="nav">
          <div class="bord">
            <div class="boardTitle">자유게시판</div>

            <div class="boardTitle">공지사항</div>

          <div class="bord">
            <div class="boardTitle">중고거래</div>

              <li class="bordCard"><a href="#">중고거래</a></li>
            </ul>
          </div>

          <div class="navSearchBar">
            <input type="text" class="searchInput" />
            <button class="searchBtn">검색</button>
          </div>
        </nav>

        <div class="product-gridmain">

            <table class="boardListmain">
              <tr class="tableTr" border="1">
                <th><a href="#">공지사항</a></th>
              </tr>
              <td>
                <span class="boardTitle-textlimit">아프리카 사장이다 이용수칙</span>

            </table>

            <table class="boardListmain">
              <tr class="tableTr">
                <th colspan="2"><a href="#">장사Tip</a></th>
              </tr>

              <td class="titleBox">
                <span class="boardTitle-textlimit">오픈 초기 마케팅 비용아끼지 마세요</span>

              <td class="viewsBox">1615</td>
              </tr>
              <tr>
              <td class="titleBox">
                <span class="boardTitle-textlimit">메뉴를 줄이고나서 오히려 매출이 올랐어요</span>
