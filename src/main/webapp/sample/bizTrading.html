<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>중고거래</title>
    <link rel="stylesheet" href="style/common.css" />
    <link rel="stylesheet" href="style/bizTrading.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=explore_nearby"
    />
  </head>
  <body>
    <div class="warp">
      <header>
        <div class="region">
          <span class="material-symbols-outlined"> explore_nearby </span>
          금천구 가산동
        </div>
        <div class="logo">아프리카 사장이다</div>
        <div class="headerR">
          <div class="name">
            <spqn class="dataName">임사장</spqn>
            <span>사장님</span>
          </div>

          <button class="logout">로그아웃</button>
        </div>
      </header>

      <div class="content">
        <nav class="nav">
          <div class="bord">
            <div class="boardTitle">자유게시판</div>
            <ul>
              <li class="bordCard"><a href="#">자유수다</a></li>
            </ul>
          </div>

          <div class="bord">
            <div class="boardTitle">공지사항</div>
            <ul>
              <li class="bordCard"><a href="#">공지사항</a></li>
              <li class="bordCard"><a href="#">문의</a></li>
              <li class="bordCard"><a href="#">신고</a></li>
            </ul>
          </div>

          <div class="bord">
            <div class="boardTitle">정보공유</div>
            <ul>
              <li class="bordCard"><a href="#">장사TIP</a></li>
              <li class="bordCard"><a href="#">Q&A</a></li>
              <li class="bordCard"><a href="#">동네소식</a></li>
            </ul>
          </div>

          <div class="bord">
            <div class="boardTitle">중고거래</div>
            <ul>
              <li class="bordCard"><a href="#">중고거래</a></li>
            </ul>
          </div>

          <div class="navSearchBar">
            <input type="text" class="searchInput" />
            <button class="searchBtn">검색</button>
          </div>
        </nav>

        <div class="bodyWarp">
          <div>
            <div class="bodyWrapHader">
              <h2 class="tilte">중고 거래
              </h2>
              <button class="writeBtn">작성하기</button>
            </div>

        <div class="product-grid">

            <div class="item-card">
              <div class="image-box">
                <img src="테이블.jpg" alt="테이블">
                <div class="price-box">5만원</div>
              </div>
              <div class="info-box">
                <div class="item-title">테이블 팝니다</div>
                <div class="item-author">별사장</div>
                <div class="item-meta">2026.09.23 조회수 20</div>
              </div>
            </div>

            <div class="item-card">
              <div class="image-box">
                <img src="젓가락.jpg" alt="젓가락">
                <div class="price-box">1,000원</div>
              </div>
              <div class="info-box">
                <div class="item-title">젓가락 3세트 판매합니다</div>
                <div class="item-author">밀크티사장</div>
                <div class="item-meta">2026.09.22 조회수 35</div>
              </div>
            </div>

            <div class="item-card">
              <div class="image-box">
                <img src="숟가락.jpg" alt="숟가락">
                <div class="price-box">무료나눔</div>
              </div>
              <div class="info-box">
                <div class="item-title">숟가락 나눔해요~</div>
                <div class="item-author">밀크티사장</div>
                <div class="item-meta">2026.09.22 조회수 42</div>
              </div>
            </div>
           </div>
          </div>

  </body>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
